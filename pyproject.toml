[project]
name = "aistart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kadir çallıoğlu", email = "latrasda@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "openai>=3.28.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "structlog>=26.1.0",
]

[project.scripts]
aistart = "aistart:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
